<div class="createpost" fxLayout="row" fxLayoutAlign="center center">
  <mat-card>
    <mat-card-header fxLayoutAlign="center center">
      <mat-card-title>Nouveau post</mat-card-title>
    </mat-card-header>
    <form class="createpost-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-card-content fxLayout="column">
        <mat-form-field fxFlex>
          <mat-label>Topic</mat-label>
          <mat-select formControlName="topicId">
            @for (topic of topics(); track topic.id) {
              <mat-option [value]="topic.id">{{ topic.title }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
        <mat-form-field fxFlex>
          <input matInput placeholder="Titre" formControlName="title">
        </mat-form-field>
        <mat-form-field fxFlex>
          <textarea matInput placeholder="Contenu" formControlName="content" rows="8"></textarea>
        </mat-form-field>
      </mat-card-content>
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Publier</button>
      @if (onError) {
        <p class="error">Une erreur est survenue</p>
      }
    </form>
  </mat-card>
</div>
