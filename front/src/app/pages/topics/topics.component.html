<div class="list" data-cy="topics-list">
  <mat-card>
    <div class="items mt2" fxLayout="row" fxLayout.lt-md="column">
      @for (topic of topicsList() ; track topic.id) {
        <app-topicscard [topic]="topic" (subscribe)="onSubscribe($event)" (detail)="onDetail()" fxFlex></app-topicscard>
      }
    </div>
  </mat-card>
</div>
