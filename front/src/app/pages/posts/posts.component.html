<div class="list">
  <mat-card>
    <mat-card-header fxLayout="row" fxLayoutAlign="space-between center">
      <mat-card-title>Posts</mat-card-title>
      <div fxLayout="row" fxLayoutGap="8px">
        <button mat-raised-button color="primary" type="button" (click)="toggleOrder()">
          <mat-icon>{{ order() === 'desc' ? 'arrow_downward' : 'arrow_upward' }}</mat-icon>
          <span class="ml1">{{ order() === 'desc' ? 'Plus récents' : 'Plus anciens' }}</span>
        </button>
        <a mat-raised-button color="accent" routerLink="/posts/new">
          <mat-icon>add</mat-icon>
          <span class="ml1">Nouveau post</span>
        </a>
      </div>
    </mat-card-header>
    <mat-card-content class="items mt2" fxLayout="row" fxLayout.lt-md="column">
      @for (post of posts(); track post.id) {
        <mat-card class="item" fxFlex>
          <mat-card-header>
            <mat-card-title>{{ post.title }}</mat-card-title>
            <mat-card-subtitle>{{ post.author }} · {{ post.date | date: 'short' }}</mat-card-subtitle>
          </mat-card-header>
          <mat-card-content>
            <p>{{ post.content }}</p>
          </mat-card-content>
          <mat-card-actions>
            <button mat-raised-button color="primary" type="button" (click)="openDetail(post)">
              Detail
            </button>
          </mat-card-actions>
        </mat-card>
      } @empty {
        <p class="empty">Aucun post. Abonnez-vous à un topic ou créez un post.</p>
      }
    </mat-card-content>
  </mat-card>
</div>
