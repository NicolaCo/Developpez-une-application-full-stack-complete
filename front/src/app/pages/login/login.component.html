<div class="login" fxLayout="row" fxLayoutAlign="center center">
    <mat-card>
        <mat-card-header fxLayoutAlign="center center">
            <mat-card-title>Login</mat-card-title>
        </mat-card-header>
        <a routerLink="/" data-cy="login-home-link"><mat-icon>arrow_back</mat-icon></a>
        <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" data-cy="login-form">
            <mat-card-content fxLayout="column">
                <mat-form-field fxFlex>
                    <input matInput placeholder="Email ou nom d'utilisateur" formControlName="email" data-cy="login-email">
                </mat-form-field>
                <mat-form-field fxFlex>
                    <input matInput [type]="hide ? 'password' : 'text'" placeholder="Password"
                        formControlName="password" data-cy="login-password">
                    <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'"
                        [attr.aria-pressed]="hide">
                        <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                </mat-form-field>
            </mat-card-content>
            <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid" data-cy="login-submit">Submit</button>
            @if (onError) {
                <p class="error" data-cy="login-error">An error occurred</p>
            }
        </form>
    </mat-card>
</div>
