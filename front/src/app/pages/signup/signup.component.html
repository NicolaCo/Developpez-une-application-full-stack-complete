<div class="signup" fxLayout="row" fxLayoutAlign="center center">
    <mat-card>
        <mat-card-header fxLayoutAlign="center center">
            <mat-card-title>Sign up</mat-card-title>
        </mat-card-header>
        <form class="signup-form" [formGroup]="form" (ngSubmit)="onSubmit()" data-cy="signup-form">
            <mat-card-content fxLayout="column">
                <mat-form-field fxFlex>
                    <input matInput placeholder="Email" formControlName="email" data-cy="signup-email">
                </mat-form-field>
                <mat-form-field fxFlex>
                    <input matInput placeholder="Username" formControlName="username" data-cy="signup-username">
                </mat-form-field>
                <mat-form-field fxFlex>
                    <input matInput [type]="hide ? 'password' : 'text'" placeholder="Password"
                        formControlName="password" data-cy="signup-password">
                    <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'"
                        [attr.aria-pressed]="hide">
                        <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                </mat-form-field>
            </mat-card-content>
            <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid" data-cy="signup-submit">Submit</button>
            @if (onError) {
                <p class="error" data-cy="signup-error">An error occurred</p>
            }
        </form>
    </mat-card>
</div>
