@if (isLoggedIn()) {
  <mat-toolbar color="primary" class="navbar">
    <div class="navbar-brand">
      <a routerLink="/" class="brand-link">MDD</a>
    </div>
    <span class="spacer"></span>
    <nav class="navbar-links">
      <a mat-button routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Accueil</a>
      <a mat-button routerLink="/posts" routerLinkActive="active-link">Articles</a>
      <a mat-button routerLink="/topics" routerLinkActive="active-link">Thématiques</a>
      <button mat-button type="button" (click)="logout()">Se déconnecter</button>
    </nav>
  </mat-toolbar>
}
